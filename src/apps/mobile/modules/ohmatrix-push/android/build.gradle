apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'org.ohmatrix.push'
version = '0.0.0'

android {
  namespace "org.ohmatrix.push"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 26)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
    consumerProguardFiles 'consumer-rules.pro'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

dependencies {
  implementation project(':expo-modules-core')
  // The service extends the one expo-notifications has (a token, or a message that is not ours, still goes to it). expo-notifications is
  // a prebuilt library here (its own maven repository, which the app's build adds), not a project of this build, so it is named by
  // its coordinates; they are the ones in its expo-module.config.json, and its version is the one the app has.
  compileOnly files(new File(["node", "--print", "require.resolve('expo-notifications/package.json')"].execute(null, rootDir).text.trim()).parentFile.toString() + "/local-maven-repo/host/exp/exponent/expo.modules.notifications/57.0.23/expo.modules.notifications-57.0.23.aar")
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
  implementation 'androidx.core:core-ktx:1.13.1'
  // The Matrix SDK's Kotlin bindings (generated by scripts/build-android.sh into this module) call the library through JNA.
  implementation "net.java.dev.jna:jna:5.17.0@aar"
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
