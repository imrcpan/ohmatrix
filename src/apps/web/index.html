<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OhMatrix</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
      }
      /* A thin scrollbar: the system's own is 17px wide on Windows, which in the 72px strip of pictures covers part of them. It stays in the layout
         (an overlay one would sit over the content), a fixed 8px, so the width of what it scrolls does not change when it comes and goes. The thumb is
         a grey that shows on both themes. */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track,
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(128, 128, 128, 0.4);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(128, 128, 128, 0.65);
      }
      ::-webkit-scrollbar-thumb:active {
        background-color: rgba(128, 128, 128, 0.8);
      }
      /* A list that hides its scrollbar (see autoHideScrollbar.ts): none at all, an indicator is drawn while it scrolls. */
      [data-autohide-scrollbar]::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      #root {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
