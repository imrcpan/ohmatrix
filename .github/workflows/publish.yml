name: publish

# Releases the Android APKs (all ABIs, signed with the release key), the web app and the Windows installers (x86_64 and ARM64). The tag is passed in by hand: v1.2.3 or 1.2.3, the same.
# The text of the release is the section `## [1.2.3]` of CHANGELOG.md, which has to be in the commit this runs on (see scripts/release-notes.sh).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of this release, like v1.2.3 or 1.2.3, the same (made here, on the commit this runs on)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        default: false
        required: true
        type: boolean

defaults:
  run:
    shell: bash

# Nothing is cached between runs: every build starts from the sources and its own downloads, and what the jobs hand to each other
# is an artifact that is gone after a day. The only thing kept is the GitHub release.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: The tag is a version, and is not taken
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT: ${{ github.event.inputs.tag }}
        run: |
          # With or without the v (or V), and with no space around it, the tag is v1.2.3.
          TAG=$(echo "$INPUT" | tr -d '[:space:]')
          TAG="v${TAG#[vV]}"
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "the tag must look like v1.2.3 or 1.2.3, not '$TAG'"; exit 1; }
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then echo "the tag $TAG exists already"; exit 1; fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  android:
    needs: check
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Build the unsigned APK
        run: scripts/build-android-${{ matrix.abi }}.sh --version "$VERSION" --release-dir "$RUNNER_TEMP/release"
      - name: Hand the APK to the signing job
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}
          path: ${{ runner.temp }}/release/android/*.apk
          retention-days: 1
          compression-level: 0

  web:
    needs: check
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build the web app
        run: scripts/build-web.sh --version "$VERSION" --release-dir "$RUNNER_TEMP/release"
      - name: Pack it
        run: tar -C "$RUNNER_TEMP/release/web" -czf "$RUNNER_TEMP/OhMatrix_web_$VERSION.tar.gz" .
      - name: Hand the archive to the release job
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: ${{ runner.temp }}/OhMatrix_web_${{ needs.check.outputs.version }}.tar.gz
          retention-days: 1
          compression-level: 0

  windows:
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Both are built on this x64 runner: the ARM64 one is a cross build (the script adds the Visual Studio ARM64 tools if the image lacks them),
      # and it checks that the program inside the installer is for the CPU asked for.
      - name: Build the installer
        shell: pwsh
        run: scripts/build-tauri-windows-${{ matrix.arch }}.ps1 -Version $env:VERSION -ReleaseDir "$env:RUNNER_TEMP/release"
      - name: Hand the installer to the release job
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/tauri-windows/*.exe
          retention-days: 1
          compression-level: 0

  sign-android:
    needs: [check, android]
    runs-on: ubuntu-latest
    # The keystore is in the secrets of this environment, which is protected: the build jobs above never see it.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download the APKs
        uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          path: ${{ runner.temp }}/unsigned
          merge-multiple: true
      - name: Sign
        env:
          OHM_KEYSTORE_PASSWORD: ${{ secrets.OHM_KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.OHM_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ vars.OHM_KEY_ALIAS }}
          CERT_SHA256: ${{ vars.OHM_CERT_SHA256 }}
        run: |
          missing=
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing secret:OHM_KEYSTORE_BASE64"
          [ -n "$OHM_KEYSTORE_PASSWORD" ] || missing="$missing secret:OHM_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing variable:OHM_KEY_ALIAS"
          [ -n "$CERT_SHA256" ] || missing="$missing variable:OHM_CERT_SHA256"
          [ -z "$missing" ] || { echo "not set in the environment 'release':$missing"; exit 1; }
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
          scripts/sign-android.sh --keystore "$ks" --key-alias "$KEY_ALIAS" --expect-sha256 "$CERT_SHA256" \
            --out-dir "$RUNNER_TEMP/signed" "$RUNNER_TEMP"/unsigned/*.apk
      - name: Hand the signed APKs to the release job
        uses: actions/upload-artifact@v7
        with:
          name: apk-signed
          path: ${{ runner.temp }}/signed/*.apk
          retention-days: 1
          compression-level: 0

  release:
    needs: [check, sign-android, web, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only what the notes come from (CHANGELOG.md and the script that cuts a version out of it), at the commit this runs on.
      - name: Checkout the changelog
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            CHANGELOG.md
            scripts/release-notes.sh
          sparse-checkout-cone-mode: false
      - name: Download everything to publish
        uses: actions/download-artifact@v8
        with:
          pattern: "{apk-signed,web,windows-*}"
          path: ${{ runner.temp }}/out
          merge-multiple: true
      - name: Checksums
        working-directory: ${{ runner.temp }}/out
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          # The notes are what CHANGELOG.md says under this version; a version with no section there gets the notes GitHub generates from the commits.
          if scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::CHANGELOG.md has no section '## [$VERSION]': the notes are generated from the commits"
            notes=(--generate-notes)
          fi
          [ "$PRERELEASE" = "true" ] && pre=(--prerelease) || pre=()
          gh release create "$TAG" "$RUNNER_TEMP"/out/* \
            --title "OhMatrix $VERSION" \
            "${notes[@]}" \
            "${pre[@]}" \
            --target "$GITHUB_SHA"

# One-time setup (Settings > Environments > release): secrets OHM_KEYSTORE_BASE64 and OHM_KEYSTORE_PASSWORD; variables OHM_KEY_ALIAS
# and OHM_CERT_SHA256. See scripts/sign.md.
